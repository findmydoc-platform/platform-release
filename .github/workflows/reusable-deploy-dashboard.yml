name: Reusable Platform Release - Dashboard

on:
  workflow_call:
    inputs:
      target_sha:
        required: true
        type: string
      platform_version:
        required: true
        type: string
      plan_digest:
        required: true
        type: string
    secrets:
      VERCEL_ORG_ID:
        required: true
      VERCEL_PROJECT_ID:
        required: true
      VERCEL_TOKEN:
        required: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1
  NODE_VERSION: 24.14.0
  PNPM_VERSION: 10.28.2
  STORYBOOK_DISABLE_TELEMETRY: 1
  VERCEL_CLI_VERSION: 56.0.0

defaults:
  run:
    shell: bash

jobs:
  deploy:
    name: Deploy frozen dashboard SHA
    if: vars.VERCEL_PRODUCTION_DEPLOYMENTS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: Production
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require dashboard main
        env:
          DEPLOY_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$DEPLOY_REF" = "refs/heads/main"

      - name: Validate release inputs
        env:
          DEPLOYMENT_COMMIT_SHA: ${{ inputs.target_sha }}
          DEPLOYMENT_ENVIRONMENT: production
          PLAN_DIGEST: ${{ inputs.plan_digest }}
          PLATFORM_VERSION: ${{ inputs.platform_version }}
          RELEASE_VERSION: ${{ inputs.platform_version }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          test "$DEPLOYMENT_ENVIRONMENT" = "production"
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DEPLOYMENT_COMMIT_SHA" = "$TARGET_SHA" ]]
          [[ "$PLAN_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$PLATFORM_VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$RELEASE_VERSION" = "$PLATFORM_VERSION" ]]

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.target_sha }}

      - name: Verify frozen SHA belongs to main
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git merge-base --is-ancestor "$TARGET_SHA" origin/main

      - name: Prepare main CI gate
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/dashboard-main-ci-gate.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          umask 077

          fail() {
            echo "Main CI gate: $1" >&2
            exit 1
          }

          phase="${1:-}"
          [[ "$phase" = initial || "$phase" = final ]] || fail "Unsupported gate phase."
          test "${GITHUB_REPOSITORY:-}" = "findmydoc-platform/clinic-dashboard" || fail "Unexpected caller repository."
          [[ "${TARGET_SHA:-}" =~ ^[0-9a-f]{40}$ ]] || fail "Invalid frozen SHA."
          test -n "${GH_TOKEN:-}" || fail "GitHub read token is required."
          test -n "${RUNNER_TEMP:-}" || fail "Runner temporary directory is required."

          api() {
            gh api --hostname github.com --method GET "$1" || fail "Cannot read GitHub CI evidence."
          }

          base="repos/$GITHUB_REPOSITORY/actions"
          workflow="$(api "$base/workflows/ci.yml")"
          jq -e 'type == "object" and .name == "CI" and .path == ".github/workflows/ci.yml" and .state == "active" and (.id | type == "number" and . > 0 and floor == .)' <<< "$workflow" >/dev/null 2>&1 || fail "Unexpected CI workflow identity."
          workflow_id="$(jq -r '.id' <<< "$workflow")"
          runs="$(api "$base/workflows/$workflow_id/runs?event=push&branch=main&head_sha=$TARGET_SHA&per_page=100")"
          jq -e 'type == "object" and .total_count == 1 and (.workflow_runs | type == "array" and length == 1)' <<< "$runs" >/dev/null 2>&1 || fail "Expected exactly one main push CI run for the frozen SHA."
          run="$(jq -c '.workflow_runs[0]' <<< "$runs")"
          jq -e '(.id | type == "number" and . > 0 and floor == .) and (.run_attempt | type == "number" and . > 0 and floor == .)' <<< "$run" >/dev/null 2>&1 || fail "Invalid CI run or attempt identity."
          run_id="$(jq -r '.id' <<< "$run")"
          run_attempt="$(jq -r '.run_attempt' <<< "$run")"

          require_success() {
            jq -e --arg repository "$GITHUB_REPOSITORY" --arg sha "$TARGET_SHA" \
              --argjson workflow "$workflow_id" --argjson run "$run_id" --argjson attempt "$run_attempt" '
              type == "object" and
              .repository.full_name == $repository and .head_repository.full_name == $repository and
              .workflow_id == $workflow and .path == ".github/workflows/ci.yml" and
              .event == "push" and .head_branch == "main" and .head_sha == $sha and
              .id == $run and .run_attempt == $attempt and
              .status == "completed" and .conclusion == "success"
            ' >/dev/null 2>&1 || fail "Current main CI run attempt is not a verified success."
          }

          require_success <<< "$run"
          current="$(api "$base/runs/$run_id")"
          require_success <<< "$current"
          attempt="$(api "$base/runs/$run_id/attempts/$run_attempt")"
          require_success <<< "$attempt"
          # Re-read the live run after the attempt endpoint; historical success cannot authorize a rerun.
          current="$(api "$base/runs/$run_id")"
          require_success <<< "$current"

          evidence="$(jq -cn --argjson workflow "$workflow_id" --argjson run "$run_id" \
            --argjson attempt "$run_attempt" --arg sha "$TARGET_SHA" \
            '{workflow_id: $workflow, run_id: $run, run_attempt: $attempt, head_sha: $sha}')"
          evidence_file="$RUNNER_TEMP/dashboard-main-ci-evidence.json"
          if [[ "$phase" = initial ]]; then
            printf '%s\n' "$evidence" > "$evidence_file"
          else
            test -f "$evidence_file" || fail "Initial CI evidence is missing."
            test "$(cat "$evidence_file")" = "$evidence" || fail "CI run attempt changed during the production build."
          fi
          printf 'Verified main CI run %s attempt %s for %s.\n' "$run_id" "$run_attempt" "$TARGET_SHA"
          EOF
          chmod 700 "$RUNNER_TEMP/dashboard-main-ci-gate.sh"

      - name: Require successful main CI
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: '"$RUNNER_TEMP/dashboard-main-ci-gate.sh" initial'

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          cache: pnpm
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        env:
          DEPLOYMENT_COMMIT_SHA: ${{ inputs.target_sha }}
          DEPLOYMENT_ENVIRONMENT: production
          RELEASE_VERSION: ${{ inputs.platform_version }}
        run: pnpm build

      - name: Pull Vercel production settings
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: pnpm dlx "vercel@${VERCEL_CLI_VERSION}" pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Prepare platform Vercel helper
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/dashboard-vercel-deployment.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          operation="${1:-}"
          target="${2:-}"

          test "$target" = "production"
          test "${DEPLOYMENT_ENVIRONMENT:-}" = "$target"
          [[ "${DEPLOYMENT_COMMIT_SHA:-}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${RELEASE_VERSION:-}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test -n "${VERCEL_CLI_VERSION:-}"

          case "$operation" in
            build)
              exec pnpm dlx "vercel@${VERCEL_CLI_VERSION}" build --prod
              ;;
            deploy)
              test -n "${VERCEL_TOKEN:-}"
              exec pnpm dlx "vercel@${VERCEL_CLI_VERSION}" deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN" \
                --env "DEPLOYMENT_ENVIRONMENT=$DEPLOYMENT_ENVIRONMENT" \
                --env "DEPLOYMENT_COMMIT_SHA=$DEPLOYMENT_COMMIT_SHA" \
                --env "RELEASE_VERSION=$RELEASE_VERSION"
              ;;
            *)
              echo "Unsupported Vercel operation '$operation'." >&2
              exit 1
              ;;
          esac
          EOF
          chmod 700 "$RUNNER_TEMP/dashboard-vercel-deployment.sh"

      - name: Build Vercel production
        env:
          DEPLOYMENT_COMMIT_SHA: ${{ inputs.target_sha }}
          DEPLOYMENT_ENVIRONMENT: production
          RELEASE_VERSION: ${{ inputs.platform_version }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: '"$RUNNER_TEMP/dashboard-vercel-deployment.sh" build production'

      - name: Recheck successful main CI
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: '"$RUNNER_TEMP/dashboard-main-ci-gate.sh" final'

      - name: Deploy Vercel production
        env:
          DEPLOYMENT_COMMIT_SHA: ${{ inputs.target_sha }}
          DEPLOYMENT_ENVIRONMENT: production
          RELEASE_VERSION: ${{ inputs.platform_version }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: '"$RUNNER_TEMP/dashboard-vercel-deployment.sh" deploy production'

  deployment-disabled:
    name: Production disabled
    if: vars.VERCEL_PRODUCTION_DEPLOYMENTS_ENABLED != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Production deployments are disabled by repository policy." >&2
          exit 1
