name: Reusable Platform Release - Dashboard

on:
  workflow_call:
    inputs:
      target_sha:
        required: true
        type: string
      platform_version:
        required: true
        type: string
      plan_digest:
        required: true
        type: string
    secrets:
      VERCEL_ORG_ID:
        required: true
      VERCEL_PROJECT_ID:
        required: true
      VERCEL_TOKEN:
        required: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1
  NODE_VERSION: 24.14.0
  PNPM_VERSION: 10.28.2
  STORYBOOK_DISABLE_TELEMETRY: 1
  VERCEL_CLI_VERSION: 56.0.0

defaults:
  run:
    shell: bash

jobs:
  deploy:
    name: Deploy frozen dashboard SHA
    if: vars.VERCEL_PRODUCTION_DEPLOYMENTS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Validate release inputs
        env:
          PLAN_DIGEST: ${{ inputs.plan_digest }}
          PLATFORM_VERSION: ${{ inputs.platform_version }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PLAN_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$PLATFORM_VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.target_sha }}

      - name: Verify frozen SHA belongs to main
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git merge-base --is-ancestor "$TARGET_SHA" origin/main

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          cache: pnpm
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate application
        run: |
          pnpm format:check
          pnpm check

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Test all layers
        run: pnpm test:all

      - name: Build application
        run: pnpm build

      - name: Pull Vercel production settings
        run: pnpm dlx "vercel@${VERCEL_CLI_VERSION}" pull --yes --environment=production --git-branch=main --token="$VERCEL_TOKEN"

      - name: Build Vercel production
        run: pnpm dlx "vercel@${VERCEL_CLI_VERSION}" build --prod

      - name: Deploy Vercel production
        run: pnpm dlx "vercel@${VERCEL_CLI_VERSION}" deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN"

  deployment-disabled:
    name: Production disabled
    if: vars.VERCEL_PRODUCTION_DEPLOYMENTS_ENABLED != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Production deployments are disabled by repository policy." >&2
          exit 1
