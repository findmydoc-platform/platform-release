name: Reusable Platform Release - Website

on:
  workflow_call:
    inputs:
      target_sha:
        required: true
        type: string
      platform_version:
        required: true
        type: string
      plan_digest:
        required: true
        type: string
    secrets:
      DATABASE_CA_CERT:
        required: true
      DATABASE_DIRECT_URI:
        required: true
      GH_PACKAGES_READ_TOKEN:
        required: true
      PAYLOAD_SECRET:
        required: true
      VERCEL_ORG_ID:
        required: true
      VERCEL_PROJECT_ID:
        required: true
      VERCEL_TOKEN:
        required: true

permissions:
  contents: read

env:
  EXPECTED_VERCEL_PROJECT_ID: prj_J8dOCr0Ft97TlCAUnbpdHG29Vtgx
  NEXT_TELEMETRY_DISABLED: 1
  NODE_VERSION: 24.14.0
  PNPM_VERSION: 10.28.2
  PRODUCTION_ALIAS_DOMAIN: findmydoc.eu

defaults:
  run:
    shell: bash

jobs:
  deploy:
    name: Deploy frozen website SHA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: Production
      url: ${{ steps.vercel-production.outputs.deploymentUrl }}
    steps:
      - name: Require website main
        env:
          DEPLOY_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$DEPLOY_REF" = "refs/heads/main"

      - name: Validate release inputs
        env:
          DEPLOYMENT_COMMIT_SHA: ${{ inputs.target_sha }}
          DEPLOYMENT_ENVIRONMENT: production
          PLAN_DIGEST: ${{ inputs.plan_digest }}
          PLATFORM_VERSION: ${{ inputs.platform_version }}
          RELEASE_VERSION: ${{ inputs.platform_version }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          test "$DEPLOYMENT_ENVIRONMENT" = "production"
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DEPLOYMENT_COMMIT_SHA" = "$TARGET_SHA" ]]
          [[ "$PLAN_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$PLATFORM_VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$RELEASE_VERSION" = "$PLATFORM_VERSION" ]]

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.target_sha }}

      - name: Verify frozen SHA belongs to main
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git merge-base --is-ancestor "$TARGET_SHA" origin/main

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          cache: false
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          package-manager-cache: false
          node-version: ${{ env.NODE_VERSION }}

      - name: Pull Vercel production settings
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          bash ./.github/scripts/deploy/assert-vercel-project-binding.sh
          pnpm dlx vercel@canary pull --yes --environment=production

      - name: Build Vercel production
        env:
          DEPLOYMENT_COMMIT_SHA: ${{ inputs.target_sha }}
          DEPLOYMENT_ENVIRONMENT: production
          DATABASE_CA_CERT: ${{ secrets.DATABASE_CA_CERT }}
          DATABASE_DIRECT_URI: ${{ secrets.DATABASE_DIRECT_URI }}
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_READ_TOKEN }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          RELEASE_VERSION: ${{ inputs.platform_version }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "GH_PACKAGES_READ_TOKEN is required for the Website build." >&2
            exit 1
          fi
          if [[ -z "${DATABASE_DIRECT_URI:-}" ]]; then
            echo "DATABASE_DIRECT_URI is required for the Website build." >&2
            exit 1
          fi
          if [[ -z "${DATABASE_CA_CERT:-}" ]]; then
            echo "DATABASE_CA_CERT is required for the Website build." >&2
            exit 1
          fi
          ca_file="$(mktemp "$RUNNER_TEMP/production-db-ca.XXXXXX")"
          trap 'rm -f "$ca_file"' EXIT
          printf '%s\n' "$DATABASE_CA_CERT" > "$ca_file"
          unset DATABASE_CA_CERT
          if [[ "$(openssl x509 -in "$ca_file" -noout -fingerprint -sha256)" != "sha256 Fingerprint=80:70:25:AD:50:D4:ED:21:9D:2C:9C:7D:29:9C:00:4F:82:4E:B0:0C:F7:F6:5A:FE:F6:07:D0:7B:72:E6:CA:FA" ]]; then
            echo "Unexpected production database CA certificate." >&2
            exit 1
          fi
          export NODE_EXTRA_CA_CERTS="$ca_file"
          bash ./.github/scripts/deploy/assert-vercel-project-binding.sh
          pnpm dlx vercel@canary build --prod --yes

      - name: Deploy Vercel production
        id: vercel-production
        env:
          DEPLOYMENT_COMMIT_SHA: ${{ inputs.target_sha }}
          DEPLOYMENT_ENVIRONMENT: production
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          RELEASE_VERSION: ${{ inputs.platform_version }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          bash ./.github/scripts/deploy/assert-vercel-project-binding.sh
          deploy_output_file="$(mktemp)"
          deploy_error_file="$(mktemp)"
          trap 'rm -f "$deploy_output_file" "$deploy_error_file"' EXIT

          for attempt in 1 2 3; do
            if pnpm dlx vercel@canary deploy --prebuilt --prod --yes \
              --env "DEPLOYMENT_ENVIRONMENT=$DEPLOYMENT_ENVIRONMENT" \
              --env "DEPLOYMENT_COMMIT_SHA=$DEPLOYMENT_COMMIT_SHA" \
              --env "RELEASE_VERSION=$RELEASE_VERSION" \
              --env "PAYLOAD_SECRET=$PAYLOAD_SECRET" \
              >"$deploy_output_file" 2>"$deploy_error_file"; then
              deployment_url="$(grep -Eo 'https://[[:alnum:].-]+\.vercel\.app' "$deploy_output_file" | tail -n 1 || true)"
              if [[ -z "$deployment_url" ]]; then
                echo "Could not parse the production deployment URL." >&2
                exit 1
              fi
              echo "deploymentUrl=$deployment_url" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            cat "$deploy_error_file" >&2
            if [[ "$attempt" -lt 3 ]] && grep -Eqi 'internal error|please try again' "$deploy_error_file"; then
              sleep "$((10 * attempt))"
              continue
            fi
            exit 1
          done

      - name: Set production alias
        env:
          DEPLOYMENT_URL: ${{ steps.vercel-production.outputs.deploymentUrl }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          bash ./.github/scripts/deploy/assert-vercel-project-binding.sh
          pnpm dlx vercel@canary alias set "$DEPLOYMENT_URL" "$PRODUCTION_ALIAS_DOMAIN"

      - name: Generate deployment summary
        if: always()
        run: bash ./.github/scripts/deploy/write-production-summary.sh "${{ steps.vercel-production.outcome }}" "${{ steps.vercel-production.outputs.deploymentUrl }}"
