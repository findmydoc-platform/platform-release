name: Platform Release

run-name: Platform release ${{ inputs.mode }}${{ inputs.confirm_version && format(' {0}', inputs.confirm_version) || '' }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Create, apply, or recover a frozen platform release
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
          - recover
      manual_version:
        description: Optional manual vX.Y.Z decision for plan mode
        required: false
        type: string
      plan_run_id:
        description: Plan workflow run ID required for apply mode
        required: false
        type: string
      confirm_version:
        description: Exact vX.Y.Z confirmation required for apply mode
        required: false
        type: string
      confirm_digest:
        description: Exact frozen plan digest required for apply mode
        required: false
        type: string
      release_content:
        description: Approved release-content.json required for apply mode
        required: false
        type: string
      confirm_content_digest:
        description: Exact structured content digest required for apply mode
        required: false
        type: string
      confirm_manifest_digest:
        description: Exact canonical manifest digest required for recover mode
        required: false
        type: string
      confirm_missing_manifest_repository:
        description: Immutable component missing the manifest in recover mode
        required: false
        type: string
      confirm_mutable_manifest_repository:
        description: Mutable component carrying the manifest in recover mode
        required: false
        type: string
      confirm_missing_platform_published_at:
        description: Confirm both legacy releases lack stable publication metadata
        required: true
        default: false
        type: boolean
      announce:
        description: Send the joint Google Chat announcement after publication
        required: true
        default: true
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: platform-release
  cancel-in-progress: false

env:
  NODE_VERSION: 24.14.0
  PNPM_VERSION: 10.13.1

defaults:
  run:
    shell: bash

jobs:
  trusted-ref:
    name: Require trusted automation main
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Reject non-main workflow refs
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$WORKFLOW_REF" = "refs/heads/main"

  plan:
    name: Freeze platform release plan
    if: inputs.mode == 'plan'
    needs: trusted-ref
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-platform
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify trusted automation checkout
        env:
          TRUSTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$TRUSTED_SHA"

      - name: Create cross-repository token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.PLATFORM_RELEASE_APP_ID }}
          private-key: ${{ secrets.PLATFORM_RELEASE_APP_PRIVATE_KEY }}
          owner: findmydoc-platform
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read
          repositories: |
            website
            clinic-dashboard

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          cache: pnpm
          node-version: ${{ env.NODE_VERSION }}

      - run: pnpm install --frozen-lockfile

      - name: Create plan
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          MANUAL_VERSION: ${{ inputs.manual_version }}
        run: |
          set -euo pipefail
          args=(
            plan
            --output artifacts/platform-release/plan.json
            --content-template artifacts/platform-release/release-content.template.json
            --json
          )
          if [[ -n "$MANUAL_VERSION" ]]; then
            [[ "$MANUAL_VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
            args+=(--version "$MANUAL_VERSION")
          fi
          pnpm platform-release "${args[@]}"

      - name: Upload frozen plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-release-plan
          path: artifacts/platform-release
          if-no-files-found: error
          retention-days: 30

  apply:
    name: Deploy and publish frozen platform release
    if: inputs.mode == 'apply'
    needs: trusted-ref
    permissions:
      actions: read
      contents: read
      deployments: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production-platform
    steps:
      - name: Validate apply inputs
        env:
          CONFIRM_DIGEST: ${{ inputs.confirm_digest }}
          CONFIRM_CONTENT_DIGEST: ${{ inputs.confirm_content_digest }}
          CONFIRM_VERSION: ${{ inputs.confirm_version }}
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
          RELEASE_CONTENT: ${{ inputs.release_content }}
        run: |
          set -euo pipefail
          [[ "$PLAN_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$CONFIRM_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$CONFIRM_CONTENT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$CONFIRM_VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test -n "$RELEASE_CONTENT"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify trusted automation checkout
        env:
          TRUSTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$TRUSTED_SHA"

      - name: Create cross-repository token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.PLATFORM_RELEASE_APP_ID }}
          private-key: ${{ secrets.PLATFORM_RELEASE_APP_PRIVATE_KEY }}
          owner: findmydoc-platform
          permission-actions: write
          permission-contents: write
          permission-pull-requests: read
          repositories: |
            website
            clinic-dashboard

      - name: Verify plan artifact provenance
        env:
          CURRENT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
        run: |
          set -euo pipefail
          IFS=$'\t' read -r source_event source_conclusion source_branch source_path source_head_sha <<< "$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PLAN_RUN_ID}" \
              --jq '[.event, .conclusion, .head_branch, .path, .head_sha] | @tsv'
          )"
          test "$source_event" = "workflow_dispatch"
          test "$source_conclusion" = "success"
          test "$source_branch" = "main"
          [[ "$source_path" == ".github/workflows/platform-release.yml"* ]]
          [[ "$source_head_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CURRENT_SHA" =~ ^[0-9a-f]{40}$ ]]

          comparison_status="$(
            gh api "repos/${GITHUB_REPOSITORY}/compare/${source_head_sha}...${CURRENT_SHA}" \
              --jq '.status'
          )"
          case "$comparison_status" in
            identical | ahead) ;;
            *)
              echo "Plan workflow commit is not an ancestor of the current automation main commit." >&2
              exit 1
              ;;
          esac

      - name: Download frozen plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          name: platform-release-plan
          path: artifacts/platform-release
          run-id: ${{ inputs.plan_run_id }}

      - name: Write approved release content
        env:
          RELEASE_CONTENT: ${{ inputs.release_content }}
        run: node --input-type=module -e "import { writeFileSync } from 'node:fs'; writeFileSync('artifacts/platform-release/release-content.json', process.env.RELEASE_CONTENT + '\n')"

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          cache: pnpm
          node-version: ${{ env.NODE_VERSION }}

      - run: pnpm install --frozen-lockfile

      - name: Apply platform release
        env:
          CONFIRM_DIGEST: ${{ inputs.confirm_digest }}
          CONFIRM_CONTENT_DIGEST: ${{ inputs.confirm_content_digest }}
          CONFIRM_VERSION: ${{ inputs.confirm_version }}
          FOUNDEROPS_PLATFORM_RELEASE_TOKEN: ${{ secrets.FOUNDEROPS_PLATFORM_RELEASE_TOKEN }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_STATE_TOKEN: ${{ github.token }}
          GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
          SEND_ANNOUNCEMENT: ${{ inputs.announce }}
        run: |
          set -euo pipefail
          args=(
            apply
            --plan artifacts/platform-release/plan.json
            --content artifacts/platform-release/release-content.json
            --manifest-output artifacts/platform-release/platform-release.json
            --confirm-digest "$CONFIRM_DIGEST"
            --confirm-content-digest "$CONFIRM_CONTENT_DIGEST"
            --confirm-version "$CONFIRM_VERSION"
            --apply
            --json
          )
          if [[ "$SEND_ANNOUNCEMENT" == "true" ]]; then
            args+=(--announce)
          fi
          pnpm platform-release "${args[@]}"

      - name: Upload canonical release manifest for resume
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-release-manifest
          path: artifacts/platform-release/platform-release.json
          if-no-files-found: ignore
          retention-days: 30

  recover:
    name: Recover frozen platform release handoff
    if: inputs.mode == 'recover'
    needs: trusted-ref
    permissions:
      actions: read
      contents: read
      deployments: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-platform
    steps:
      - name: Validate recovery inputs
        env:
          CONFIRM_CONTENT_DIGEST: ${{ inputs.confirm_content_digest }}
          CONFIRM_DIGEST: ${{ inputs.confirm_digest }}
          CONFIRM_MANIFEST_DIGEST: ${{ inputs.confirm_manifest_digest }}
          CONFIRM_MISSING_MANIFEST_REPOSITORY: ${{ inputs.confirm_missing_manifest_repository }}
          CONFIRM_MISSING_PLATFORM_PUBLISHED_AT: ${{ inputs.confirm_missing_platform_published_at }}
          CONFIRM_MUTABLE_MANIFEST_REPOSITORY: ${{ inputs.confirm_mutable_manifest_repository }}
          CONFIRM_VERSION: ${{ inputs.confirm_version }}
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
          RELEASE_CONTENT: ${{ inputs.release_content }}
        run: |
          set -euo pipefail
          [[ "$PLAN_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$CONFIRM_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$CONFIRM_CONTENT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$CONFIRM_MANIFEST_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$CONFIRM_VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$CONFIRM_MISSING_MANIFEST_REPOSITORY" = "findmydoc-platform/clinic-dashboard"
          test "$CONFIRM_MUTABLE_MANIFEST_REPOSITORY" = "findmydoc-platform/website"
          test "$CONFIRM_MISSING_PLATFORM_PUBLISHED_AT" = "true"
          test -n "$RELEASE_CONTENT"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify trusted automation checkout
        env:
          TRUSTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$TRUSTED_SHA"

      - name: Create read-only cross-repository token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.PLATFORM_RELEASE_APP_ID }}
          private-key: ${{ secrets.PLATFORM_RELEASE_APP_PRIVATE_KEY }}
          owner: findmydoc-platform
          permission-actions: read
          permission-contents: read
          repositories: |
            website
            clinic-dashboard

      - name: Verify plan artifact provenance
        env:
          CURRENT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
        run: |
          set -euo pipefail
          IFS=$'\t' read -r source_event source_conclusion source_branch source_path source_head_sha <<< "$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PLAN_RUN_ID}" \
              --jq '[.event, .conclusion, .head_branch, .path, .head_sha] | @tsv'
          )"
          test "$source_event" = "workflow_dispatch"
          test "$source_conclusion" = "success"
          test "$source_branch" = "main"
          [[ "$source_path" == ".github/workflows/platform-release.yml"* ]]
          [[ "$source_head_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CURRENT_SHA" =~ ^[0-9a-f]{40}$ ]]
          comparison_status="$(
            gh api "repos/${GITHUB_REPOSITORY}/compare/${source_head_sha}...${CURRENT_SHA}" \
              --jq '.status'
          )"
          case "$comparison_status" in
            identical | ahead) ;;
            *)
              echo "Plan workflow commit is not an ancestor of the current automation main commit." >&2
              exit 1
              ;;
          esac

      - name: Download frozen plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          name: platform-release-plan
          path: artifacts/platform-release
          run-id: ${{ inputs.plan_run_id }}

      - name: Write approved release content
        env:
          RELEASE_CONTENT: ${{ inputs.release_content }}
        run: node --input-type=module -e "import { writeFileSync } from 'node:fs'; writeFileSync('artifacts/platform-release/release-content.json', process.env.RELEASE_CONTENT + '\n')"

      - name: Download canonical manifest from complete release
        env:
          CONFIRM_MUTABLE_MANIFEST_REPOSITORY: ${{ inputs.confirm_mutable_manifest_repository }}
          CONFIRM_VERSION: ${{ inputs.confirm_version }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          gh release download "$CONFIRM_VERSION" \
            --repo "$CONFIRM_MUTABLE_MANIFEST_REPOSITORY" \
            --pattern platform-release.json \
            --dir artifacts/platform-release/recovery

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          cache: pnpm
          node-version: ${{ env.NODE_VERSION }}

      - run: pnpm install --frozen-lockfile

      - name: Recover FounderOps handoff and announcement
        env:
          CONFIRM_CONTENT_DIGEST: ${{ inputs.confirm_content_digest }}
          CONFIRM_DIGEST: ${{ inputs.confirm_digest }}
          CONFIRM_MANIFEST_DIGEST: ${{ inputs.confirm_manifest_digest }}
          CONFIRM_MISSING_MANIFEST_REPOSITORY: ${{ inputs.confirm_missing_manifest_repository }}
          CONFIRM_MUTABLE_MANIFEST_REPOSITORY: ${{ inputs.confirm_mutable_manifest_repository }}
          CONFIRM_VERSION: ${{ inputs.confirm_version }}
          FOUNDEROPS_PLATFORM_RELEASE_TOKEN: ${{ secrets.FOUNDEROPS_PLATFORM_RELEASE_TOKEN }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_STATE_TOKEN: ${{ github.token }}
          GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
          SEND_ANNOUNCEMENT: ${{ inputs.announce }}
        run: |
          set -euo pipefail
          args=(
            recover
            --plan artifacts/platform-release/plan.json
            --content artifacts/platform-release/release-content.json
            --manifest artifacts/platform-release/recovery/platform-release.json
            --confirm-version "$CONFIRM_VERSION"
            --confirm-digest "$CONFIRM_DIGEST"
            --confirm-content-digest "$CONFIRM_CONTENT_DIGEST"
            --confirm-manifest-digest "$CONFIRM_MANIFEST_DIGEST"
            --confirm-missing-manifest-repository "$CONFIRM_MISSING_MANIFEST_REPOSITORY"
            --confirm-mutable-manifest-repository "$CONFIRM_MUTABLE_MANIFEST_REPOSITORY"
            --confirm-missing-platform-published-at
            --apply
            --json
          )
          if [[ "$SEND_ANNOUNCEMENT" == "true" ]]; then
            args+=(--announce)
          fi
          pnpm platform-release "${args[@]}"
