name: Platform Release

run-name: Platform release ${{ inputs.mode }}${{ inputs.confirm_version && format(' {0}', inputs.confirm_version) || '' }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Create a frozen plan or apply an existing plan artifact
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
      manual_version:
        description: Optional manual vX.Y.Z decision for plan mode
        required: false
        type: string
      plan_run_id:
        description: Plan workflow run ID required for apply mode
        required: false
        type: string
      confirm_version:
        description: Exact vX.Y.Z confirmation required for apply mode
        required: false
        type: string
      confirm_digest:
        description: Exact frozen plan digest required for apply mode
        required: false
        type: string
      release_notes:
        description: Approved Markdown notes required for apply mode
        required: false
        type: string
      announce:
        description: Send the joint Google Chat announcement after publication
        required: true
        default: true
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: platform-release
  cancel-in-progress: false

env:
  NODE_VERSION: 24.14.0
  PNPM_VERSION: 10.13.1

defaults:
  run:
    shell: bash

jobs:
  trusted-ref:
    name: Require trusted automation main
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Reject non-main workflow refs
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$WORKFLOW_REF" = "refs/heads/main"

  plan:
    name: Freeze platform release plan
    if: inputs.mode == 'plan'
    needs: trusted-ref
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-platform
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify trusted automation checkout
        env:
          TRUSTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$TRUSTED_SHA"

      - name: Create cross-repository token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.PLATFORM_RELEASE_APP_ID }}
          private-key: ${{ secrets.PLATFORM_RELEASE_APP_PRIVATE_KEY }}
          owner: findmydoc-platform
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read
          repositories: |
            website
            clinic-dashboard

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          cache: pnpm
          node-version: ${{ env.NODE_VERSION }}

      - run: pnpm install --frozen-lockfile

      - name: Create plan
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          MANUAL_VERSION: ${{ inputs.manual_version }}
        run: |
          set -euo pipefail
          args=(
            platform-release plan
            --output artifacts/platform-release/plan.json
            --notes-template artifacts/platform-release/release-notes.md
            --json
          )
          if [[ -n "$MANUAL_VERSION" ]]; then
            [[ "$MANUAL_VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
            args+=(--version "$MANUAL_VERSION")
          fi
          pnpm platform-release "${args[@]}"

      - name: Upload frozen plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-release-plan
          path: artifacts/platform-release
          if-no-files-found: error
          retention-days: 30

  apply:
    name: Deploy and publish frozen platform release
    if: inputs.mode == 'apply'
    needs: trusted-ref
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production-platform
    steps:
      - name: Validate apply inputs
        env:
          CONFIRM_DIGEST: ${{ inputs.confirm_digest }}
          CONFIRM_VERSION: ${{ inputs.confirm_version }}
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          [[ "$PLAN_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$CONFIRM_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$CONFIRM_VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test -n "$RELEASE_NOTES"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify trusted automation checkout
        env:
          TRUSTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$TRUSTED_SHA"

      - name: Create cross-repository token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.PLATFORM_RELEASE_APP_ID }}
          private-key: ${{ secrets.PLATFORM_RELEASE_APP_PRIVATE_KEY }}
          owner: findmydoc-platform
          permission-actions: write
          permission-contents: write
          permission-issues: write
          permission-pull-requests: read
          repositories: |
            website
            clinic-dashboard

      - name: Verify plan artifact provenance
        env:
          CURRENT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
        run: |
          set -euo pipefail
          IFS=$'\t' read -r source_event source_conclusion source_branch source_path source_head_sha <<< "$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PLAN_RUN_ID}" \
              --jq '[.event, .conclusion, .head_branch, .path, .head_sha] | @tsv'
          )"
          test "$source_event" = "workflow_dispatch"
          test "$source_conclusion" = "success"
          test "$source_branch" = "main"
          [[ "$source_path" == ".github/workflows/platform-release.yml"* ]]
          test "$source_head_sha" = "$CURRENT_SHA"

      - name: Download frozen plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          name: platform-release-plan
          path: artifacts/platform-release
          run-id: ${{ inputs.plan_run_id }}

      - name: Write approved notes
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: node --input-type=module -e "import { writeFileSync } from 'node:fs'; writeFileSync('artifacts/platform-release/release-notes.md', process.env.RELEASE_NOTES + '\n')"

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          cache: pnpm
          node-version: ${{ env.NODE_VERSION }}

      - run: pnpm install --frozen-lockfile

      - name: Apply platform release
        env:
          CONFIRM_DIGEST: ${{ inputs.confirm_digest }}
          CONFIRM_VERSION: ${{ inputs.confirm_version }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
          SEND_ANNOUNCEMENT: ${{ inputs.announce }}
        run: |
          set -euo pipefail
          args=(
            platform-release apply
            --plan artifacts/platform-release/plan.json
            --notes artifacts/platform-release/release-notes.md
            --confirm-digest "$CONFIRM_DIGEST"
            --confirm-version "$CONFIRM_VERSION"
            --apply
            --json
          )
          if [[ "$SEND_ANNOUNCEMENT" == "true" ]]; then
            args+=(--announce)
          fi
          pnpm platform-release "${args[@]}"
