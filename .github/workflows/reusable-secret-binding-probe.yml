name: Reusable Website Secret Binding Probe

on:
  workflow_call:
    secrets:
      DATABASE_DIRECT_URI:
        required: false

permissions:
  contents: read

jobs:
  probe:
    name: Check Website Production secret binding
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: Production
      deployment: false
    steps:
      - name: Report secret presence
        shell: bash
        env:
          DATABASE_DIRECT_URI: ${{ secrets.DATABASE_DIRECT_URI }}
        run: |
          set -euo pipefail
          if [[ -n "$DATABASE_DIRECT_URI" ]]; then
            echo "DATABASE_DIRECT_URI=present"
          else
            echo "DATABASE_DIRECT_URI=missing"
          fi
